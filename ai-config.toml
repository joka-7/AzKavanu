# AI-assistant config manifest, consumed by `python .ai/bin/ai-sync`.
# .ai is the ogen-ai submodule (https://github.com/joka-7/ogen-ai). See .ai/README.md.

[project]
name = "AzKavanu"

[stack]
# npm workspaces: platform-free TypeScript core + React PWA wrapped by Capacitor for Android
languages  = ["typescript"]
frameworks = ["react"]
practices  = ["testing", "git-commits", "security", "architecture", "documentation", "verification"]

[tools]
targets = ["claude"]

[options]
# `copy`, not `symlink`: GitHub Pages, Vercel and the Android build don't initialize
# the .ai submodule, so symlinks into it would dangle there. Re-run ai-sync after
# pulling rule updates.
link_mode = "copy"
local_tail = "ai-config.local.md"
# The role agents (/role-review, /role, /role-implement, ...)
claude_agents = true
